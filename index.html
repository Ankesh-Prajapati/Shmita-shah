<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shmita Shah — Cinematographer &amp; Visual Storyteller</title>
<meta name="description" content="Shmita Shah — cinematographer, photographer and visual storyteller.">
<meta name="theme-color" content="#050505">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="loading">

<!-- LOADER: cinemascope shutters -->
<div id="leader" aria-hidden="true">
  <i class="lp t"></i><i class="lp b"></i>
  <div class="ld">
    <div class="ld-top"><span>Reel 01</span><span id="ldFrames">Frame 000</span></div>
    <h2 class="ld-name" id="ldName" data-t="name"></h2>
    <div class="ld-line"><i id="ldFill"></i></div>
    <p class="ld-sub" data-t="title"></p>
    <div class="ld-count"><b id="count">000</b><em>%</em></div>
  </div>
</div>

<div class="grain" aria-hidden="true"></div><div class="leak" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div><div id="burn" aria-hidden="true"></div>
<div class="bars" aria-hidden="true"></div>
<div id="cur" aria-hidden="true"><i id="curLabel"></i></div>
<div class="hud" aria-hidden="true">
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <div class="h tl"><em class="rec"></em> REC <span id="hChap">Opening</span></div>
  <div class="h tr" id="hTc">00:00:00:00</div>
  <div class="h bl" id="hExp">ISO 800 · f/1.8 · 1/50</div>
  <div class="h br" id="hPct">000</div>
</div>
<div class="bar" id="bar"></div>

<div id="stage">
  <!-- 00 · OPENING -->
  <article class="scene sr" data-chap="Opening" id="s-hero">
    <div class="back" data-img="hero"></div>
    <figure class="still">
      <div class="pic" data-img="hero"></div><i class="rule"></i>
      <div class="af"><i></i><i></i><i></i><i></i><em>AF · LOCK</em></div>
      <figcaption class="cap"><b>Fig. 00</b><span data-cap="hero"></span></figcaption>
    </figure>
    <div class="txt">
      <div class="slate"><span>Scene 00</span><span>Take 01</span></div>
      <h1 class="display" id="tw1" data-t="opening"></h1>
      <p class="who"><b id="tw2" data-t="name"></b><span id="tw3" data-t="title"></span></p>
    </div>
    <div class="cue" aria-hidden="true"><i class="ln"><b></b></i><span>Scroll</span></div>
  </article>

  <!-- 01 · THE EYE -->
  <article class="scene sl" data-chap="The Eye" data-zoom="out">
    <div class="back" data-img="eye"></div>
    <figure class="still">
      <div class="pic" data-img="eye"></div><i class="rule"></i>
      <figcaption class="cap"><b>Fig. 01</b><span data-cap="eye"></span></figcaption>
    </figure>
    <div class="txt">
      <div class="slate"><span>Scene 01</span><span>Take 01</span></div>
      <span class="ch" data-t="eye.chapter"></span>
      <h2 class="display split" data-t="eye.title"></h2>
      <p class="body" data-t="eye.p1"></p><p class="body" data-t="eye.p2"></p>
      <blockquote class="pull" data-t="eye.pull"></blockquote>
    </div>
  </article>

  <!-- 02 · CHAREVETI -->
  <article class="scene sr" data-chap="Chareveti Films">
    <div class="back" data-img="chareveti"></div>
    <figure class="still">
      <div class="pic" data-img="chareveti"></div><i class="rule"></i>
      <figcaption class="cap"><b>Fig. 02</b><span data-cap="chareveti"></span></figcaption>
    </figure>
    <div class="txt">
      <div class="slate"><span>Scene 02</span><span>Take 01</span></div>
      <div class="chrow"><span class="ch" data-t="chareveti.chapter"></span></div>
      <h2 class="mark" aria-label="चरैवेति Films"><span class="dv" data-t="chareveti.wm1"></span><span class="fl" data-t="chareveti.wm2"></span></h2>
      <p class="role" data-t="chareveti.role"></p><p class="body" data-t="chareveti.p1"></p>
      <a class="link" data-link="chareveti" target="_blank" rel="noopener"></a>
    </div>
  </article>

  <!-- 03 · MEMORIES OF JOY -->
  <article class="scene sl" data-chap="Memories of Joy">
    <div class="back" data-img="moj"></div>
    <figure class="still">
      <div class="pic" data-img="moj"></div><i class="rule"></i>
      <figcaption class="cap"><b>Fig. 03</b><span data-cap="moj"></span></figcaption>
    </figure>
    <div class="txt">
      <div class="slate"><span>Scene 03</span><span>Take 01</span></div>
      <div class="chrow"><img class="seal" data-seal="moj" alt="Memories of Joy logo"><span class="ch" data-t="moj.chapter"></span></div>
      <h2 class="mark" aria-label="Memories of Joy"><span class="dv lat" data-t="moj.wm1"></span><span class="fl" data-t="moj.wm2"></span></h2>
      <p class="tag" data-t="moj.title"></p><p class="role" data-t="moj.role"></p><p class="body" data-t="moj.p1"></p>
      <a class="link" data-link="moj" target="_blank" rel="noopener"></a>
    </div>
  </article>

  <!-- 04 · TINYY STEPS STUDIO -->
  <article class="scene sr" data-chap="Tinyy Steps Studio">
    <div class="back" data-img="tss"></div>
    <figure class="still">
      <div class="pic" data-img="tss"></div><i class="rule"></i>
      <figcaption class="cap"><b>Fig. 04</b><span data-cap="tss"></span></figcaption>
    </figure>
    <div class="txt">
      <div class="slate"><span>Scene 04</span><span>Take 01</span></div>
      <div class="chrow"><img class="seal" data-seal="tss" alt="Tinyy Steps Studio logo"><span class="ch" data-t="tss.chapter"></span></div>
      <h2 class="mark" aria-label="Tinyy Steps Studio"><span class="dv lat" data-t="tss.wm1"></span><span class="fl" data-t="tss.wm2"></span></h2>
      <p class="tag" data-t="tss.title"></p><p class="role" data-t="tss.role"></p><p class="body" data-t="tss.p1"></p>
      <a class="link" data-link="tss" target="_blank" rel="noopener"></a>
    </div>
  </article>

  <!-- 05 · THE FRAMES (film strip) -->
  <article class="scene" data-chap="The Frames" id="s-frames">
    <div id="shots"></div>
    <div class="ftxt"><span class="ch" data-t="framesIntro.chapter"></span><h2 class="display" data-t="framesIntro.title"></h2></div>
    <div class="meta"><b id="fCap"></b><span id="fNum"></span></div>
    <div class="strip"><div class="track" id="track"></div></div>
    <div class="thumbs" id="thumbs"></div>
  </article>

  <!-- 06 · BEYOND THE FRAME (end-credits roll between two counter-moving film reels) -->
  <article class="scene" data-chap="Beyond the Frame">
    <div class="back dim" data-img="credits"></div>
    <div class="cwrap">
      <div class="reel l" id="reelL" aria-hidden="true"></div>
      <div class="reel r" id="reelR" aria-hidden="true"></div>
      <div class="credits" id="credits">
        <div class="slate"><span>Scene 06</span><span>Take 01</span></div>
        <figure class="card"><div class="pic" data-img="credits"></div></figure>
        <span class="ch" data-t="beyond.chapter"></span><h2 class="display" data-t="beyond.title"></h2>
        <p class="body" data-t="beyond.bio"></p><p class="body quote" data-t="beyond.philosophy"></p>
        <h3 data-t="beyond.workHead"></h3><ul id="work"></ul>
        <h3 data-t="beyond.placesHead"></h3><ul id="places"></ul>
      </div>
    </div>
  </article>

  <!-- 07 · FINAL SCENE -->
  <article class="scene" data-chap="Final Scene">
    <div class="back soft" data-img="final"></div>
    <div class="txt c"><p class="display" id="finalText"></p><div class="contact" id="contactLinks"></div><footer data-t="footer"></footer></div>
  </article>
</div>

<main id="timeline" aria-hidden="true">
  <div class="sp" style="height:140vh"></div><div class="sp" style="height:200vh"></div><div class="sp" style="height:200vh"></div>
  <div class="sp" style="height:200vh"></div><div class="sp" style="height:200vh"></div><div class="sp" style="height:640vh"></div>
  <div class="sp" style="height:380vh"></div><div class="sp" style="height:300vh"></div>
</main>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
